<head>
<meta charset="utf-8"/>

<meta content="only light" name="color-scheme"/>
<meta content="Jahangir Ceram product catalog" name="description"/>
<title>Jahangir Ceram</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');

  :root {
    --dark: #343434;
    --gold: #D5982C;
    --silver: #C0C0C0;
    --dark-2: #3d3d3d;
    --dark-3: #2a2a2a;
    --surface: #cfcfcf;
    --border: #4a4a4a;
    --muted: #999;
  }
  body.light-mode {
    --dark: #f7f7f7;
    --dark-2: #ffffff;
    --dark-3: #eeeeee;
    --silver: #333333;
    --surface: #d8d8d8;
    --border: #c8c8c8;
    --muted: #666666;
  }
  * { box-sizing: border-box; }
  html { color-scheme: only light; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Vazirmatn', sans-serif;
    background-color: var(--surface);
    background: var(--surface);
    transition: background 0.2s ease, color 0.2s ease;
  }
  button { font-family: inherit; cursor: pointer; }
  .theme-toggle {
    align-self: flex-start;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    color: var(--silver);
    background: var(--dark-2);
    border: 1px solid var(--border);
    border-radius: 50%;
    padding: 0;
    font-size: 13px;
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .theme-toggle:hover { color: var(--gold); border-color: var(--gold); }
  .theme-icon {
    display: inline-block;
    font-size: 19px;
    line-height: 1;
    vertical-align: middle;
  }
  .page-number {
    margin-top: auto;
    padding-top: 12mm;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
  }
  .back-icon {
    display: inline-block;
    margin-left: 6px;
    font-size: 18px;
    line-height: 1;
    vertical-align: -1px;
  }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .page {
    width: 210mm;
    min-height: 297mm;
    margin: 0 auto 12mm;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20mm;
    background: var(--dark);
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
  }
  .logo {
    width: min(140px, 32vw);
    height: auto;
  }
  .title {
    color: var(--silver);
    font-size: clamp(24px, 5vw, 36px);
    font-weight: 900;
    text-align: center;
    margin: 18px 0 40px;
    letter-spacing: 0.3px;
    direction: ltr;
  }

  .categories {
    width: 100%;
    max-width: 560px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  .cat-btn {
    position: relative;
    overflow: hidden;
    background: linear-gradient(145deg, var(--dark-2), var(--dark-3));
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 30px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
    transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  }
  .cat-btn:hover {
    transform: translateY(-3px);
    border-color: var(--gold);
    background: linear-gradient(145deg, var(--dark-3), var(--dark-2));
    box-shadow: 0 14px 28px rgba(0, 0, 0, 0.28);
  }
  .cat-btn img.cat-icon {
    height: clamp(56px, 12vw, 76px);
    width: auto;
    max-width: 100%;
    object-fit: contain;
    filter: invert(70%) sepia(55%) saturate(950%) hue-rotate(1deg) brightness(0.95) contrast(0.98);
  }
  .cat-btn .cat-icon-placeholder {
    width: 64px;
    height: 64px;
    border: 1.5px dashed #6a6a6a;
    border-radius: 4px;
  }
  .cat-btn span {
    color: var(--silver);
    font-size: 15px;
    font-weight: 600;
  }
  .cat-btn.active {
    border-color: var(--gold);
    background: var(--dark-3);
  }
  .cat-btn.active span { color: var(--gold); }
  .cat-btn.active img.cat-icon { filter: invert(70%) sepia(55%) saturate(950%) hue-rotate(1deg) brightness(1.1) contrast(1.02); }

  .subpanel {
    grid-column: 1 / -1;
    display: none;
    background: var(--dark-3);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 16px;
    margin-top: -2px;
  }
  .subpanel.open { display: flex; flex-direction: column; gap: 8px; }
  .category-sheet .catalog-page {
    background: linear-gradient(145deg, var(--dark-3), var(--dark-2));
    border-radius: 14px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 12px 30px rgba(0,0,0,0.14);
  }
  .category-subitems {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 8px auto 0;
  }
  .category-subitems > .sub-item {
    font-size: 15px;
    border-radius: 9px;
    padding: 14px 16px;
    background: linear-gradient(90deg, var(--dark-2), var(--dark-3));
  }
  .subpanel .sub-item {
    color: var(--silver);
    font-size: 14px;
    padding: 10px 12px;
    background: var(--dark-2);
    border: 1px solid var(--border);
    border-radius: 3px;
    text-align: right;
  }
  .sub-item-clickable {
    width: 100%;
    font-family: inherit;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .sub-item-clickable.active {
    border-color: var(--gold);
    background: var(--dark-3);
    color: var(--gold);
  }
  .child-panel {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px 12px 4px 12px;
    margin-top: -2px;
  }
  .child-title {
    color: var(--gold);
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .child-panel .sub-item {
    background: var(--dark-3);
    font-size: 13px;
  }
  .catalog-page {
    width: 100%;
    max-width: 100%;
    background: var(--dark-3);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 20px;
  }
  .catalog-back {
    color: var(--silver);
    background: var(--dark-2);
    border: 1px solid #5a5a5a;
    border-radius: 3px;
    padding: 10px 14px;
    margin-bottom: 20px;
    font-size: 14px;
  }
  .catalog-back:hover { border-color: var(--gold); color: var(--gold); }
  .catalog-breadcrumb {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    margin: 0 0 18px;
  }
  .catalog-heading {
    color: var(--gold);
    font-size: 22px;
    font-weight: 800;
    text-align: center;
    margin: 0 0 8px;
  }
  .catalog-subheading {
    color: var(--silver);
    font-size: 13px;
    text-align: center;
    margin: 0 0 20px;
  }
  .catalog-sheet { justify-content: flex-start; }
  @media (max-width: 820px) {
    .page {
      width: calc(100vw - 20px);
      min-height: calc((100vw - 20px) * 1.4142);
      margin-bottom: 10px;
      padding: 28px 18px 40px;
    }
  }
  @media print {
    html, body { background: #fff; }
    .page { margin: 0; box-shadow: none; page-break-after: always; }
  }

  .category-subitems { counter-reset: category-card; }
  .category-subitems > .sub-item {
    counter-increment: category-card;
    min-height: 70px;
    display: flex;
    align-items: center;
    padding: 18px 58px 18px 50px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -.1px;
    background: linear-gradient(105deg, rgba(67,60,51,.98), rgba(33,31,28,.98));
    box-shadow: 0 10px 22px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .category-subitems > .sub-item::before {
    content: counter(category-card, decimal-leading-zero);
    position: absolute;
    right: 18px;
    top: 50%;
    width: 27px;
    height: 27px;
    display: grid;
    place-items: center;
    transform: translateY(-50%);
    color: var(--gold-soft);
    background: rgba(214,163,58,.16);
    border: 1px solid rgba(242,212,139,.4);
    border-radius: 9px;
    font-size: 11px;
    font-weight: 800;
    direction: ltr;
  }
  .category-subitems > .sub-item::after { float: none; position: absolute; left: 20px; top: 50%; transform: translateY(-50%); }
  .category-subitems > .sub-item:hover::after,
  .category-subitems > .sub-item:focus-visible::after { transform: translate(-4px,-50%); }
  .category-subitems > .sub-item.has-children { border-right: 3px solid var(--gold); }
  .category-subitems > .sub-item.has-children[aria-expanded="true"] { border-radius: 14px 14px 8px 8px; color: var(--gold-soft); }

  function render() {
    var wrap = document.getElementById("categories");
    wrap.innerHTML = "";

      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "cat-btn" + (activeId === cat.id ? " active" : "");
      btn.setAttribute("aria-pressed", String(activeId === cat.id));
      var iconHtml = cat.logo
        ? '<img class="cat-icon" src="' + cat.logo + '" alt="' + cat.name + '">'
        : '<div class="cat-icon-placeholder"></div>';
      btn.innerHTML = iconHtml + "<span>" + localizeName(cat.name) + "</span>";
      btn.onclick = function () {
        activeId = cat.id;
        render();
        showCategoryPage(cat);
      };
      wrap.appendChild(btn);
    });
    var contactButton = document.createElement("button");
    contactButton.type = "button";
    contactButton.className = "cat-btn contact-btn";
    contactButton.setAttribute("aria-label", tr("contactUs"));
    contactButton.setAttribute("aria-pressed", "false");
    contactButton.innerHTML =
      '<svg class="contact-icon" viewBox="0 0 24 24" aria-hidden="true">' +

      }

    wrap.appendChild(contactButton);

  function refreshSheetLanguage(sheet) {
    var pageKey = sheet.dataset.pageKey || "";
    var heading = sheet.querySelector(".catalog-heading");
    var breadcrumb = sheet.querySelector(".catalog-breadcrumb");
    var pageNumber = sheet.querySelector(".page-number");
    var back = sheet.querySelector(".catalog-back");
    if (back) {
      Array.prototype.forEach.call(back.childNodes, function (node) {
        if (node.nodeType === 3) node.nodeValue = tr("back");
      });
    }
    if (pageNumber && sheet.dataset.pageNumber) pageNumber.textContent = pageLabel(sheet.dataset.pageNumber);
    if (pageKey === "about-us") {
      if (heading) heading.textContent = tr("aboutUs");
      if (breadcrumb) breadcrumb.textContent = localizePath("Jahangir Ceram / About Us");
      var aboutText = sheet.querySelector(".about-panel > div");
      if (aboutText) aboutText.textContent = tr("aboutText");
    } else if (pageKey === "contact-us") {
      if (heading) heading.textContent = tr("contactUs");
      if (breadcrumb) breadcrumb.textContent = localizePath("Jahangir Ceram / Contact Us");
      var contactText = sheet.querySelector(".contact-intro");
      if (contactText) contactText.textContent = tr("contactText");
      sheet.querySelectorAll("[data-contact-label]").forEach(function (node) {
        node.textContent = tr(node.dataset.contactLabel);
      });
      sheet.querySelectorAll("[data-contact-value]").forEach(function (node) {
        var key = node.dataset.contactValue;
        node.textContent = contactValue(key);
        if (key === "factoryAddress" || key === "officeAddress") {
          node.setAttribute("dir", currentLanguage === "en" ? "ltr" : "rtl");
        }
        if (CONTACT_DETAILS[key].href) node.setAttribute("href", CONTACT_DETAILS[key].href);
        else node.setAttribute("href", contactMapHref(key));
      });
      var contactPanel = sheet.querySelector(".contact-panel");
      if (contactPanel) contactPanel.setAttribute("aria-label", tr("contactDetails"));
      var socialLinks = sheet.querySelector(".social-links");
      if (socialLinks) socialLinks.setAttribute("aria-label", tr("socialLinks"));
      sheet.querySelectorAll(".social-link").forEach(function (link) {
        var platform = link.dataset.platform;
        var label = socialLabel(platform);
        link.setAttribute("aria-label", label);
        link.setAttribute("title", label);
        var labelNode = link.querySelector(".social-label");
        if (labelNode) labelNode.textContent = label;
      });
    } else if (pageKey.indexOf("product-80x80-") === 0) {
      var productIndex = Number(sheet.dataset.productIndex || pageKey.split("-").pop());
      var productName = MATTE_PRODUCTS[productIndex] || "";
      if (heading) heading.textContent = localizeName(productName) + " · " + localizeName("80×80");
      if (breadcrumb) breadcrumb.textContent = localizePath("Jahangir Ceram / Porcelain Ceramic");
      var productImage = sheet.querySelector(".cloudy-product-image");
      if (productImage) productImage.alt = tr("productImageAlt").replace("{name}", productName).replace("80×80", "\u200e80×80\u200e");
    } else if (pageKey.indexOf("jahangir-nano-80-product-") === 0) {
      var jNano80Index = Number(sheet.dataset.jahangirNano80Index || pageKey.split("-").pop());
      var jNano80Name = JAHANGIR_NANO_80_PRODUCTS[jNano80Index] || "";
      if (heading) heading.textContent = jNano80Name + " · 80×80";
      if (breadcrumb) breadcrumb.textContent = "Jahangir Ceram / Porcelain Ceramic / Nano Polish / 80×80";
    } else if (pageKey.indexOf("jahangir-product-60120-") === 0) {
      var j60120Index = Number(sheet.dataset.jahangir60120Index || pageKey.split("-").pop());
      var j60120Name = MATTE_60120_PRODUCTS[j60120Index] || "";
      if (heading) heading.textContent = j60120Name + " · 60×120";
      if (breadcrumb) breadcrumb.textContent = "Jahangir Ceram / Porcelain Ceramic / Matte / 60×120";
    } else if (pageKey.indexOf("sialk-product-page19-") === 0) {
      var sialkProductIndex = Number(sheet.dataset.sialkProductIndex || pageKey.split("-").pop());
      var sialkProductName = SIALK_PAGE19_PRODUCTS[sialkProductIndex] || "";
      if (heading) heading.textContent = sialkProductName;
      if (breadcrumb) breadcrumb.textContent = "Sialk Ceram / Porcelain Ceramic / Nano Polish / 60" + String.fromCharCode(0xD7) + "120";
    } else if (pageKey.indexOf("sialk-product-page25-") === 0) {
      var sialkPage25Index = Number(sheet.dataset.sialkPage25Index || pageKey.split("-").pop());
      var sialkPage25Name = SIALK_PAGE25_PRODUCTS[sialkPage25Index] || "";
      if (heading) heading.textContent = sialkPage25Name;
      if (breadcrumb) breadcrumb.textContent = "Sialk Ceram / Porcelain Ceramic / Nano Polish / 80" + String.fromCharCode(0xD7) + "80";
    } else if (pageKey.indexOf("sialk-product-page30-") === 0) {
      var sialkPage30Index = Number(sheet.dataset.sialkPage30Index || pageKey.split("-").pop());
      var sialkPage30Name = SIALK_PAGE30_PRODUCTS[sialkPage30Index] || "";
      if (heading) heading.textContent = sialkPage30Name;
      if (breadcrumb) breadcrumb.textContent = "Sialk Ceram / Porcelain Ceramic / Nano Polish / 100" + String.fromCharCode(0xD7) + "100";
    } else if (pageKey.indexOf("sialk-product-page34-") === 0) {
      var sialkPage34Index = Number(sheet.dataset.sialkPage34Index || pageKey.split("-").pop());
      var sialkPage34Name = SIALK_PAGE34_PRODUCTS[sialkPage34Index] || "";
      if (heading) heading.textContent = sialkPage34Name;
      if (breadcrumb) breadcrumb.textContent = "Sialk Ceram / Porcelain Ceramic / Crystal Polish / 100" + String.fromCharCode(0xD7) + "100";
    } else if (pageKey.indexOf("category-") === 0) {
      var categoryId = sheet.dataset.categoryId || pageKey.slice("category-".length);
      var category = CATEGORIES.find(function (candidate) { return candidate.id === categoryId; });
      if (category) {
        if (heading) heading.textContent = localizeName(category.name);
        if (breadcrumb) breadcrumb.textContent = tr("selectSubcategory");
      }
    } else {
      if (heading) heading.textContent = catalogHeadingLabel(sheet.dataset.catalogSize || "", sheet.dataset.catalogPath || "");
      if (breadcrumb) breadcrumb.textContent = catalogBreadcrumbLabel(sheet.dataset.catalogPath || "");
    }
    sheet.querySelectorAll("[data-entry-original-name]").forEach(function (node) {
      node.textContent = localizeName(node.dataset.entryOriginalName);
    });
    sheet.querySelectorAll(".product-link").forEach(function (link) {
      var isSialkProduct = link.dataset.sialkProductIndex !== undefined;
      var isSialkPage25Product = link.dataset.sialkPage25Index !== undefined;
      var isSialkPage30Product = link.dataset.sialkPage30Index !== undefined;
      var isSialkPage34Product = link.dataset.sialkPage34Index !== undefined;
      var isJahangir60120Product = link.dataset.jahangir60120Index !== undefined;
      var isJahangirNano80Product = link.dataset.jahangirNano80Index !== undefined;
      var productIndex = Number(isJahangirNano80Product ? link.dataset.jahangirNano80Index : (isSialkProduct ? link.dataset.sialkProductIndex : (isSialkPage25Product ? link.dataset.sialkPage25Index : (isSialkPage30Product ? link.dataset.sialkPage30Index : (isSialkPage34Product ? link.dataset.sialkPage34Index : (isJahangir60120Product ? link.dataset.jahangir60120Index : link.dataset.productIndex))))));
      var productName = isJahangirNano80Product ? (JAHANGIR_NANO_80_PRODUCTS[productIndex] || "") : (isSialkProduct ? (SIALK_PAGE19_PRODUCTS[productIndex] || "") : (isSialkPage25Product ? (SIALK_PAGE25_PRODUCTS[productIndex] || "") : (isSialkPage30Product ? (SIALK_PAGE30_PRODUCTS[productIndex] || "") : (isSialkPage34Product ? (SIALK_PAGE34_PRODUCTS[productIndex] || "") : (isJahangir60120Product ? (MATTE_60120_PRODUCTS[productIndex] || "") : (MATTE_PRODUCTS[productIndex] || ""))))));
      var localizedProductName = (isJahangirNano80Product || isSialkProduct || isSialkPage25Product || isSialkPage30Product || isSialkPage34Product || isJahangir60120Product) ? productName : localizeName(productName);
      var label = (isJahangirNano80Product ? ("View " + localizedProductName + " 80×80 product page") : (isJahangir60120Product ? ("View " + localizedProductName + " 60×120 product page") : (isSialkProduct ? ("View " + localizedProductName + " 80×80 product page") : tr("viewProduct").replace("{name}", localizedProductName).replace("80×80", "\u200e80×80\u200e"))));
      link.setAttribute("aria-label", label);
      var productNameNode = link.querySelector(".product-name");
      if (productNameNode) productNameNode.textContent = localizedProductName;
      var image = link.querySelector("img");
      if (image) image.alt = tr("productImageAlt").replace("{name}", localizedProductName).replace("80×80", "\u200e80×80\u200e");
    });
  }
  function applyLanguage() {
    var direction = LANGUAGES[currentLanguage].dir;
    document.documentElement.lang = currentLanguage;
    document.documentElement.dir = direction;
    document.title = tr("siteTitle");
    document.body.classList.toggle("rtl", direction === "rtl");
    if (pageTitle) pageTitle.textContent = tr("siteTitle");
    if (themeToggle) themeToggle.setAttribute("aria-label", tr("themeToggle"));
    if (languageSelect) {
      languageSelect.value = currentLanguage;
      languageSelect.setAttribute("aria-label", tr("languageSelect"));
    }
    render();
    document.querySelectorAll(".page-number").forEach(function (node) {
      var match = node.textContent.match(/(\d+)\s*$/);
      if (match) node.textContent = pageLabel(match[1]);
    });
    document.querySelectorAll("#catalog-pages > .page").forEach(refreshSheetLanguage);
  }

  window.addEventListener("popstate", function () {
    if (location.hash.indexOf("#catalog-") !== 0 && location.hash.indexOf("#category-") !== 0) {
      pageTitle.textContent = tr("siteTitle");
      activeId = null;
      activeSubName = null;
      render();
    }
  });

  var languageSelect = document.getElementById("language-select");
  if (languageSelect) {
    languageSelect.value = currentLanguage;
    languageSelect.addEventListener("change", function () {
      currentLanguage = languageSelect.value;
      writeStoredLanguage(currentLanguage);
      applyLanguage();
    });
  }
  createAboutPage();
  CATEGORIES.forEach(function (category) {
    showCategoryPage(category, { initial: true });
    precreateCatalogPages(category, category.sub, []);
  });
  createContactPage();
  render();
  applyLanguage();
</script>
