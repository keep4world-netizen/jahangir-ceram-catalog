<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>پنل مدیریت کاتالوگ جهانگیر سرام</title>
<link rel="icon" href="/assets/images/jahangir-ceram-logo.webp" type="image/webp">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap');
  :root { --bg:#f3f3f1; --card:#fff; --ink:#26241f; --muted:#77736a; --line:#dcdad3; --gold:#b9821c; --gold-d:#8f6212; --danger:#b3261e; --ok:#1f7a3d; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Vazirmatn',Tahoma,sans-serif; background:var(--bg); color:var(--ink); font-size:15px; }
  button, input, select { font:inherit; }
  button { cursor:pointer; }
  .btn { border:1px solid var(--line); background:var(--card); color:var(--ink); padding:8px 14px; border-radius:8px; }
  .btn:hover { border-color:var(--gold); color:var(--gold-d); }
  .btn.primary { background:var(--gold); border-color:var(--gold); color:#fff; font-weight:600; }
  .btn.primary:hover { background:var(--gold-d); color:#fff; }
  .btn.danger { color:var(--danger); }
  .btn.danger:hover { border-color:var(--danger); color:var(--danger); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn.sm { padding:4px 9px; font-size:13px; }
  header { position:sticky; top:0; z-index:10; display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:10px 16px; background:#2f2d29; color:#fff; }
  header h1 { font-size:16px; margin:0; margin-inline-end:auto; }
  header .btn { background:#3d3a35; border-color:#57534b; color:#fff; }
  header .btn.primary { background:var(--gold); border-color:var(--gold); }
  #status { font-size:13px; color:#d7d3c8; }
  .layout { display:grid; grid-template-columns:270px 1fr; gap:16px; padding:16px; max-width:1300px; margin:0 auto; }
  nav { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px; align-self:start; position:sticky; top:64px; max-height:calc(100vh - 80px); overflow:auto; }
  nav h3 { margin:10px 8px 6px; font-size:13px; color:var(--gold-d); }
  nav h3:first-child { margin-top:2px; }
  .nav-item { display:flex; justify-content:space-between; gap:8px; width:100%; text-align:start; border:0; background:none; padding:8px; border-radius:8px; }
  .nav-item:hover { background:#f4efe3; }
  .nav-item.active { background:#f1e6cc; font-weight:600; }
  .nav-item small { display:block; color:var(--muted); direction:ltr; text-align:right; font-weight:400; }
  .count { background:#ece8dc; border-radius:99px; padding:0 8px; height:22px; line-height:22px; font-size:12px; align-self:center; }
  .view-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .view-head h2 { margin:0; font-size:18px; margin-inline-end:auto; }
  .view-head small { color:var(--muted); direction:ltr; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
  .card.is-new { border-color:var(--ok); }
  .thumb { aspect-ratio:1/1; background:#e9e7e0 center/cover no-repeat; position:relative; }
  .thumb .tag { position:absolute; top:6px; inset-inline-start:6px; background:var(--ok); color:#fff; font-size:11px; padding:1px 7px; border-radius:99px; }
  .card .name { padding:8px 10px 2px; font-weight:600; direction:ltr; text-align:left; word-break:break-word; }
  .card .sub { padding:0 10px 6px; color:var(--muted); font-size:12px; min-height:18px; }
  .card .acts { display:flex; gap:5px; padding:8px 10px 10px; margin-top:auto; flex-wrap:wrap; }
  .empty { padding:40px; text-align:center; color:var(--muted); background:var(--card); border:1px dashed var(--line); border-radius:12px; }
  .changes { background:#fff8e6; border:1px solid #ecd9a6; border-radius:10px; padding:8px 12px; margin-bottom:12px; font-size:13px; }
  .changes ul { margin:4px 0 0; padding-inline-start:18px; }
  /* login */
  #login { max-width:520px; margin:8vh auto; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px; }
  #login h2 { margin-top:0; }
  #login input { width:100%; direction:ltr; padding:10px; border:1px solid var(--line); border-radius:8px; margin:8px 0 12px; }
  #login ol { padding-inline-start:20px; color:var(--muted); font-size:13.5px; line-height:1.9; }
  #login code { background:#f1efe8; padding:1px 5px; border-radius:4px; direction:ltr; unicode-bidi:embed; }
  .err { color:var(--danger); font-size:14px; margin:8px 0 0; white-space:pre-wrap; }
  /* modal */
  dialog { border:0; border-radius:14px; padding:0; width:min(560px,94vw); box-shadow:0 20px 60px rgba(0,0,0,.35); }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  .modal-in { padding:18px 20px 16px; }
  .modal-in h3 { margin:0 0 12px; }
  .field { margin-bottom:12px; }
  .field label { display:block; font-size:13px; margin-bottom:4px; color:var(--muted); }
  .field input[type=text] { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; }
  .field input.ltr { direction:ltr; text-align:left; }
  .field .cur { display:flex; align-items:center; gap:10px; margin-top:6px; font-size:12px; color:var(--muted); }
  .field .cur img { width:56px; height:56px; object-fit:cover; border-radius:6px; border:1px solid var(--line); }
  .modal-foot { display:flex; gap:8px; justify-content:flex-start; margin-top:6px; }
  #toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#2f2d29; color:#fff; padding:10px 16px; border-radius:10px; z-index:50; max-width:90vw; display:none; white-space:pre-wrap; }
  #toast.err { background:var(--danger); }
  @media (max-width: 800px) { .layout { grid-template-columns:1fr; } nav { position:static; max-height:none; } }

  /* ---- dark / gold theme (matches the catalog) ---- */
  :root { --bg:#0e0f11; --card:#181a1d; --ink:#ece7dc; --muted:#9b9486; --line:#34322c; --gold:#d4a84b; --gold-d:#f2d48b; --danger:#ff8178; --ok:#5acb8a; }
  body { background:radial-gradient(1200px 500px at 50% -120px, #2a2416 0%, transparent 70%), var(--bg); }
  header { background:#131417; border-bottom:1px solid rgba(242,212,139,.35); }
  header h1 { color:var(--gold-d); }
  .btn { background:#1f2124; }
  .btn.primary, .btn.primary:hover { color:#1a1408; }
  .btn.primary { background:linear-gradient(135deg,#f2d48b,#d4a84b); }
  .btn.primary:hover { filter:brightness(1.08); }
  nav .nav-item { color:var(--ink); } nav .nav-item:hover { background:#22242a; }
  nav .nav-item.active { background:#2b2517; box-shadow:inset 0 0 0 1px rgba(242,212,139,.45); }
  nav h3 { color:var(--gold-d); }
  .count { background:#2a2c31; color:var(--ink); } .count.warn { background:#5a2b27; color:#ffd2ce; } .count.okc { background:#1f3a2b; color:#b8f0d1; }
  .card { background:var(--card); } .card.is-new { box-shadow:0 0 0 1px var(--gold); }
  .thumb { background-color:#111214; }
  .changes { background:#2a2417; border-color:#5b4a22; color:var(--ink); }
  #login code { background:#26282c; }
  input[type=text], input[type=password], input[type=file] { background:#111214; color:var(--ink); border:1px solid var(--line); border-radius:8px; }
  dialog { background:var(--card); color:var(--ink); } dialog::backdrop { background:rgba(0,0,0,.7); }
  #toast { border:1px solid var(--line); }
  /* translation audit */
  .hint { color:var(--muted); font-size:13px; margin:0 0 10px; } .ck { font-size:13px; color:var(--muted); }
  .tr { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .tr-row { display:grid; grid-template-columns:1fr 1.3fr 1.3fr 1.2fr; gap:8px; align-items:center; padding:8px 10px; border-bottom:1px solid var(--line); }
  .tr-row:last-child { border-bottom:0; } .tr-row input { width:100%; padding:7px 9px; }
  .tr-row .en { direction:ltr; text-align:left; font-weight:600; } .tr-row .iss { font-size:12px; display:flex; flex-wrap:wrap; gap:4px; }
  .bad { background:#4a2724; color:#ffc9c4; border-radius:99px; padding:1px 8px; } .good { color:var(--ok); }
  /* history + preview */
  .hist { max-height:60vh; overflow:auto; } .hrow { display:flex; gap:10px; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); }
  .hmsg { font-size:12px; color:var(--muted); margin-top:2px; } .curv { background:var(--gold); color:#1a1408; border-radius:99px; padding:0 8px; font-size:11px; }
  #pv { width:min(1240px,98vw); height:94vh; padding:0; border:1px solid rgba(242,212,139,.4); border-radius:14px; overflow:hidden; }
  #pv[open] { display:flex; flex-direction:column; } #pv .bar { display:flex; gap:8px; align-items:center; padding:8px 12px; background:#131417; } #pv .bar b { margin-inline-end:auto; color:var(--gold-d); }
  #pv .wrap { flex:1; background:#050506; overflow:auto; } #pv iframe { display:block; border:0; width:100%; height:100%; background:#fff; } #pv.m iframe { width:400px; margin:0 auto; }
  @media (max-width: 800px) { .tr-row { grid-template-columns:1fr; } }
</style>
</head>
<body>

<div id="login" hidden>
  <h2>ورود به پنل مدیریت</h2>
  <p>نام کاربری و رمز عبور را وارد کنید.</p>
  <input id="userInput" type="text" placeholder="نام کاربری" autocomplete="username" autocapitalize="off">
  <input id="passInput" type="password" placeholder="رمز عبور" autocomplete="current-password">
  <button class="btn primary" id="loginBtn">ورود</button>
  <p class="err" id="loginErr"></p>
</div>

<div id="app" hidden>
  <header>
    <h1>پنل مدیریت کاتالوگ جهانگیر سرام</h1>
    <span id="status"></span>
    <button class="btn primary" id="publishBtn" disabled>انتشار تغییرات</button>
    <button class="btn" id="discardBtn" disabled>لغو تغییرات</button>
    <button class="btn" id="previewBtn">پیش‌نمایش سایت</button>
    <button class="btn" id="histBtn">تاریخچه</button>
    <a class="btn" href="/" target="_blank" rel="noopener" style="text-decoration:none">مشاهده سایت</a>
    <button class="btn" id="logoutBtn">خروج</button>
  </header>
  <div class="layout">
    <nav id="nav"></nav>
    <section id="view"></section>
  </div>
</div>

<dialog id="dlg"><div class="modal-in" id="dlgBody"></div></dialog>
<dialog id="pv"><div class="bar"><b>پیش‌نمایش (منتشر نشده)</b><button class="btn sm" id="pvM">موبایل / دسکتاپ</button><button class="btn sm" id="pvClose">بستن</button></div><div class="wrap"><iframe id="pvFrame" title="preview"></iframe></div></dialog>
<div id="toast"></div>

<script>
(function () {
  'use strict';
  var DATA_PATH = 'data/catalog-data.js';
  var IMG = 'assets/images/';
  var FA = { 'Jahangir Ceram':'جهانگیر سرام', 'Sialk Ceram':'سیلک سرام', 'Porcelain Ceramic':'سرامیک پرسلان', 'Matte':'مات',
    'Nano Polish':'نانو پولیش', 'Crystal Polish':'کریستال پولیش', 'Washbasin':'روشویی', 'Puzzle':'پازل',
    'Decorative':'دکوراتیو', 'Fitileh':'فیتیله', 'Takgol':'تک گل' };

  var auth = '', branch = 'main', headSha = '';
  var treeSet = new Set(), data = null, loadedText = '';
  var newFiles = new Map();   // path -> { blob, url }
  var delFiles = new Set();   // existing repo paths to delete
  var log = [];               // human readable change list
  var curId = null;
  var busy = false;

  function $(id) { return document.getElementById(id); }
  function el(html) { var t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
  function fa(s) { return String(s).split(' / ').map(function (p) { return FA[p] || p; }).join(' / '); }
  function toast(msg, isErr) {
    var t = $('toast'); t.textContent = msg; t.className = isErr ? 'err' : ''; t.style.display = 'block';
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = 'none'; }, isErr ? 7000 : 3500);
  }
  function setStatus(s) { $('status').textContent = s || ''; }

  /* ---------- GitHub API ---------- */
  function gh(path, opts) {
    opts = opts || {};
    var init = { method: opts.method || 'GET', headers: { Authorization: 'Basic ' + auth, 'Content-Type': 'application/json' } };
    if (opts.body) init.body = opts.body;
    return fetch('/api/gh?p=' + encodeURIComponent(path), init).then(function (r) {
      if (r.ok) return r;
      return r.text().then(function (t) {
        var m = ''; try { m = JSON.parse(t).message || ''; } catch (e) { m = ''; }
        if (r.status === 401) throw new Error('نام کاربری یا رمز عبور اشتباه است.');
        if (r.status === 404 && !m) throw new Error('سرویس /api/gh روی سایت پیدا نشد. مطمئن شو فایل api/gh.js در ریپو هست و دیپلوی Vercel تمام شده.');
        if (r.status === 500 && /not configured/.test(m)) throw new Error('متغیرهای محیطی در Vercel تنظیم نشده‌اند (GITHUB_TOKEN، ADMIN_USER، ADMIN_PASS). بعد از تنظیم باید Redeploy کنی.');
        if (r.status === 502 && /token/.test(m)) throw new Error('توکن GitHub که در Vercel گذاشته‌ای نامعتبر یا منقضی است.');
        throw new Error('خطا ' + r.status + ': ' + (m || t.slice(0, 200)));
      });
    });
  }
  function repo(p) { return p; }
  function parseData(text) {
    var i = text.indexOf('{'), j = text.lastIndexOf('}');
    if (i < 0 || j < 0) throw new Error('قالب فایل data/catalog-data.js نامعتبر است');
    return JSON.parse(text.slice(i, j + 1));
  }
  function serialize() { return 'window.CATALOG_DATA = ' + JSON.stringify(data, null, 1) + ';\n'; }
  function fetchRemote() {
    return gh(repo('/git/ref/heads/' + branch)).then(function (r) { return r.json(); }).then(function (ref) {
      var sha = ref.object.sha;
      return gh(repo('/git/commits/' + sha)).then(function (r) { return r.json(); }).then(function (c) {
        return gh(repo('/contents/' + DATA_PATH + '?ref=' + sha), { headers: { Accept: 'application/vnd.github.raw+json' } })
          .then(function (r) { return r.text(); }).then(function (text) { return { sha: sha, tree: c.tree.sha, text: text }; });
      });
    });
  }

  function load() {
    setStatus('در حال بارگذاری از GitHub…');
    return gh(repo('')).then(function (r) { return r.json(); }).then(function (info) {
      branch = info.default_branch;
      return fetchRemote();
    }).then(function (rem) {
      headSha = rem.sha; loadedText = rem.text; data = parseData(rem.text);
      return gh(repo('/git/trees/' + rem.tree + '?recursive=1')).then(function (r) { return r.json(); });
    }).then(function (t) {
      treeSet = new Set(t.tree.filter(function (x) { return x.type === 'blob'; }).map(function (x) { return x.path; }));
      newFiles.forEach(function (v) { URL.revokeObjectURL(v.url); });
      newFiles = new Map(); delFiles = new Set(); log = [];
      if (!data.names) data.names = {};
      if (curId !== '__tr' && (!curId || !findGallery(curId))) curId = data.galleries[0].id;
      setStatus(''); render();
    });
  }

  /* ---------- helpers ---------- */
  function findGallery(id) { return data.galleries.filter(function (g) { return g.id === id; })[0]; }
  function gLabel(g) { return fa(g.path) + (g.size ? ' · ' + g.size : ''); }
  function slug(s) { return String(s).toLowerCase().replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'product'; }
  function sizeSlug(s) { return String(s).replace(/×/g, 'x').toLowerCase(); }
  function isGS(g) { return g.kind === 'gold-silver'; }
  function refs(g, p) {
    if (isGS(g)) { var out = [IMG + p.gold, g.thumbs + p.gold]; if (p.silver) out.push(IMG + p.silver, g.thumbs + p.silver); return out; }
    return [p.gallery, p.detail].filter(Boolean);
  }
  function refCount() {
    var m = {}; data.galleries.forEach(function (g) { g.products.forEach(function (p) { refs(g, p).forEach(function (r) { m[r] = (m[r] || 0) + 1; }); }); }); return m;
  }
  function releaseUnreferenced(paths) {
    var m = refCount();
    paths.forEach(function (p) {
      if (m[p]) return;
      if (newFiles.has(p)) { URL.revokeObjectURL(newFiles.get(p).url); newFiles.delete(p); }
    });
  }
  function uniquePath(base, ext) {
    var p = base + ext, n = 2;
    while (treeSet.has(p) || newFiles.has(p) || delFiles.has(p)) { p = base + '-' + n + ext; n++; }
    return p;
  }
  function imgUrl(path) {
    if (newFiles.has(path)) return newFiles.get(path).url;
    return '/' + encodeURI(path);
  }
  function cardImg(g, p) { return isGS(g) ? imgUrl(g.thumbs + p.gold) : imgUrl(p.gallery); }
  function dirty() { return log.length > 0; }

  /* ---------- image processing ---------- */
  /* Full-quality image handling.
   * - A WebP that is not a square thumbnail is uploaded byte-for-byte (no re-encoding, no resizing).
   * - Anything else (JPG/PNG/...) is converted at full resolution with near-lossless quality.
   * - Square thumbnails are a center crop only (same look as the other catalog cards).
   * The only limit is file size: /api/gh accepts blobs up to ~3 MB, so if a file is bigger the quality
   * (and only then the size) is reduced just enough to fit. maxSide = 0 means "never downscale". */
  var MAX_BYTES = 2900000;
  function encodeWebp(canvas, q) { return new Promise(function (res) { canvas.toBlob(res, 'image/webp', q); }); }
  function toWebp(file, maxSide, square) {
    if (!square && file.type === 'image/webp' && file.size <= MAX_BYTES) return Promise.resolve(file);
    return createImageBitmap(file).then(function (bmp) {
      var sx = 0, sy = 0, sw = bmp.width, sh = bmp.height, cw, ch;
      if (square) { var s = Math.min(sw, sh); sx = (sw - s) / 2; sy = (sh - s) / 2; sw = sh = s; cw = ch = maxSide ? Math.min(maxSide, s) : s; }
      else { var k = maxSide ? Math.min(1, maxSide / Math.max(sw, sh)) : 1; cw = Math.round(sw * k); ch = Math.round(sh * k); }
      var qualities = [0.97, 0.94, 0.91, 0.88, 0.85];
      function attempt(w, h, qi) {
        var c = document.createElement('canvas'); c.width = w; c.height = h;
        var ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(bmp, sx, sy, sw, sh, 0, 0, w, h);
        return encodeWebp(c, qualities[qi]).then(function (blob) {
          if (!blob || blob.type !== 'image/webp') throw new Error('این مرورگر تبدیل به WebP را پشتیبانی نمی‌کند (از Chrome یا Edge استفاده کن).');
          if (blob.size <= MAX_BYTES) return blob;
          if (qi + 1 < qualities.length) return attempt(w, h, qi + 1);
          if (w < 600) return blob;
          return attempt(Math.round(w * 0.85), Math.round(h * 0.85), 0);
        });
      }
      return attempt(cw, ch, 0);
    });
  }
  function addFile(path, blob) { newFiles.set(path, { blob: blob, url: URL.createObjectURL(blob) }); }
  function blobToB64(blob) {
    return blob.arrayBuffer().then(function (buf) {
      var bytes = new Uint8Array(buf), s = '';
      for (var i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      return btoa(s);
    });
  }
  function textToB64(text) {
    var bytes = new TextEncoder().encode(text), s = '';
    for (var i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s);
  }

  /* ---------- rendering ---------- */
  function render() { renderNav(); renderView(); renderBar(); }
  function renderBar() {
    $('publishBtn').disabled = !dirty() || busy;
    $('discardBtn').disabled = !dirty() || busy;
    $('publishBtn').textContent = dirty() ? 'انتشار تغییرات (' + log.length + ')' : 'انتشار تغییرات';
  }
  function renderNav() {
    var nav = $('nav'), html = '', brand = null, tc = trCount();
    html += '<button class="nav-item' + (curId === '__tr' ? ' active' : '') + '" data-id="__tr"><span>بررسی ترجمه‌ها<small>Persian / Arabic names</small></span><span class="count ' + (tc ? 'warn' : 'okc') + '">' + (tc || '✓') + '</span></button>';
    data.galleries.forEach(function (g) {
      if (g.brand !== brand) { brand = g.brand; html += '<h3>' + esc(fa(brand)) + '</h3>'; }
      html += '<button class="nav-item' + (g.id === curId ? ' active' : '') + '" data-id="' + esc(g.id) + '"><span>' + esc(gLabel(g)) +
        '<small>' + esc(g.path + (g.size ? ' ' + g.size : '')) + '</small></span><span class="count">' + g.products.length + '</span></button>';
    });
    nav.innerHTML = html;
    nav.querySelectorAll('.nav-item').forEach(function (b) { b.onclick = function () { curId = b.dataset.id; render(); window.scrollTo(0, 0); }; });
  }
  function renderView() {
    if (curId === '__tr') return renderTr($('view'));
    var g = findGallery(curId), v = $('view'), html = '';

  /* ---------- actions ---------- */
  function move(g, i, d) {
    var j = i + d; if (j < 0 || j >= g.products.length) return;
    var t = g.products[i]; g.products[i] = g.products[j]; g.products[j] = t;
    log.push('جابه‌جایی «' + t.name + '» در ' + gLabel(g)); render();
  }
  function removeProduct(g, i) {
    var p = g.products[i];
    if (!confirm('محصول «' + p.name + '» از گالری «' + gLabel(g) + '» حذف شود؟\n(بعد از «انتشار تغییرات» از کاتالوگ سایت حذف می‌شود. فایل عکس‌هایش در ریپو می‌ماند.)')) return;

  }

  function openForm(g, idx) {
    var editing = idx >= 0, p = editing ? g.products[idx] : null, nm = editing ? (data.names[p.name] || {}) : {};
    var gs = isGS(g);
    function fileField(id, label, cur, opt) {
      return '<div class="field"><label>' + label + (opt ? ' (اختیاری)' : '') + '</label><input type="file" id="' + id + '" accept="image/*">' +
        (cur ? '<div class="cur"><img src="' + esc(imgUrl(cur)) + '" alt=""><span>تصویر فعلی؛ برای جایگزینی فایل جدید انتخاب کن</span></div>' : '') + '</div>';
    }

      '<div class="field"><label>نام فارسی (اختیاری)</label><input type="text" id="fFa" value="' + esc(nm.fa || '') + '"></div>' +

        (editing && p.silver ? '<div class="field"><label><input type="checkbox" id="fNoSilver"> حذف تصویر Silver این محصول</label></div>' : '');
    } else {
      html += fileField('fGal', 'عکس کارت گالری' + (editing ? '' : ' (الزامی)'), editing ? p.gallery : '', false) +
        fileField('fDet', 'عکس صفحه محصول' + (editing ? '' : ' (الزامی)'), editing ? p.detail : '', false);
    }
    html += '<div class="modal-foot"><button class="btn primary" id="fOk">' + (editing ? 'ثبت ویرایش' : 'افزودن') + '</button><button class="btn" id="fCancel">انصراف</button></div><p class="err" id="fErr"></p>';
    $('dlgBody').innerHTML = html;
    var dlg = $('dlg'); dlg.showModal();
    $('fCancel').onclick = function () { dlg.close(); };
    $('fOk').onclick = function () {
      $('fOk').disabled = true; $('fErr').textContent = '';
      submitForm(g, idx).then(function () { dlg.close(); }).catch(function (e) { $('fErr').textContent = e.message || String(e); $('fOk').disabled = false; });
    };
  }

  function submitForm(g, idx) {
    var editing = idx >= 0, old = editing ? g.products[idx] : null, gs = isGS(g);
    var name = $('fName').value.trim().replace(/\s+/g, ' '), faN = $('fFa').value.trim(), arN = $('fAr').value.trim();
    if (!name) return Promise.reject(new Error('نام انگلیسی را وارد کن.'));
    if (/[<>"'\\]/.test(name)) return Promise.reject(new Error('نام نباید شامل < > " \' \\ باشد.'));
    if (/ (Gold|Silver)$/i.test(name)) return Promise.reject(new Error('انتهای نام نباید «Gold» یا «Silver» باشد؛ سایت خودش آن را اضافه می‌کند.'));
    if (g.products.some(function (q, i) { return i !== idx && q.name.toLowerCase() === name.toLowerCase(); }))
      return Promise.reject(new Error('محصولی با این نام در همین گالری وجود دارد.'));
    var F = function (id) { var e = $(id); return e && e.files && e.files[0] ? e.files[0] : null; };
    var base = slug(name), ss = g.size ? '-' + sizeSlug(g.size) : '';
    var jobs = [], product;
    if (gs) {
      var gold = F('fGold'), silver = F('fSilver'), noSilver = $('fNoSilver') && $('fNoSilver').checked;
      if (!editing && !gold) return Promise.reject(new Error('عکس Gold الزامی است.'));
      product = editing ? { name: name, gold: old.gold, silver: noSilver ? '' : old.silver } : { name: name, gold: '', silver: '' };
      var released = [];
      if (gold) {
        var gp = uniquePath(IMG + base + '-' + sizeSlug(g.size), '.webp'), gfile = gp.slice(IMG.length);
        released = released.concat(editing ? refs(g, old).filter(function (r) { return r === IMG + old.gold || r === g.thumbs + old.gold; }) : []);
        jobs.push(toWebp(gold, 0, false).then(function (b) { addFile(gp, b); }));
        jobs.push(toWebp(gold, 800, true).then(function (b) { addFile(g.thumbs + gfile, b); }));
        product.gold = gfile;
      }
      if (silver) {
        var sp = uniquePath(IMG + base + '-' + sizeSlug(g.size) + '-silver', '.webp'), sfile = sp.slice(IMG.length);
        if (editing && old.silver) released.push(IMG + old.silver, g.thumbs + old.silver);
        jobs.push(toWebp(silver, 0, false).then(function (b) { addFile(sp, b); }));
        jobs.push(toWebp(silver, 800, true).then(function (b) { addFile(g.thumbs + sfile, b); }));
        product.silver = sfile;
      } else if (editing && noSilver && old.silver) released.push(IMG + old.silver, g.thumbs + old.silver);
    } else {
      var gal = F('fGal'), det = F('fDet');
      if (!editing && (!gal || !det)) return Promise.reject(new Error('هر دو عکس (کارت گالری و صفحه محصول) الزامی‌اند.'));
      product = editing ? { name: name, gallery: old.gallery, detail: old.detail } : { name: name, gallery: '', detail: '' };
      var released = [];
      if (gal) { var pg = uniquePath(IMG + base + '-gallery' + ss, '.webp'); if (editing) released.push(old.gallery); jobs.push(toWebp(gal, 0, false).then(function (b) { addFile(pg, b); })); product.gallery = pg; }
      if (det) { var pd = uniquePath(IMG + base + ss, '.webp'); if (editing) released.push(old.detail); jobs.push(toWebp(det, 0, false).then(function (b) { addFile(pd, b); })); product.detail = pd; }
    }
    return Promise.all(jobs).then(function () {
      if (editing) {
        g.products[idx] = product;
        if (old.name !== name) delete_name_if_unused(old.name);
        releaseUnreferenced(released);
        log.push('ویرایش «' + old.name + '»' + (old.name !== name ? ' ← «' + name + '»' : '') + ' در ' + gLabel(g));
      } else {
        g.products.push(product);
        log.push('افزودن «' + name + '» به ' + gLabel(g));
      }
      if (faN || arN) data.names[name] = { fa: faN, ar: arN }; else if (data.names[name]) delete data.names[name];
      render();
    });
  }
  function delete_name_if_unused(n) {
    var used = data.galleries.some(function (g) { return g.products.some(function (p) { return p.name === n; }); });
    if (!used) delete data.names[n];
  }

  /* ---------- publish ---------- */
  function publish() {
    if (!dirty() || busy) return;
    if (!confirm('تغییرات روی GitHub ثبت و سایت به‌روز شود؟')) return;
    busy = true; renderBar();
    var paths = Array.from(newFiles.keys()), tree = [], step = 0, total = paths.length + 4;
    function prog(t) { step++; setStatus(t + ' (' + step + '/' + total + ')'); }
    prog('بررسی آخرین نسخه');
    fetchRemote().then(function (rem) {
      if (rem.text !== loadedText) throw new Error('فایل داده روی GitHub بعد از باز کردن پنل تغییر کرده است. صفحه را رفرش کن (تغییرات منتشرنشده از بین می‌روند) و دوباره انجام بده.');
      var chain = Promise.resolve();
      paths.forEach(function (p) {
        chain = chain.then(function () { prog('آپلود ' + p.split('/').pop()); return blobToB64(newFiles.get(p).blob); })
          .then(function (b64) { return gh(repo('/git/blobs'), { method: 'POST', body: JSON.stringify({ content: b64, encoding: 'base64' }) }); })
          .then(function (r) { return r.json(); })
          .then(function (j) { tree.push({ path: p, mode: '100644', type: 'blob', sha: j.sha }); });
      });
      return chain.then(function () {
        prog('ثبت فایل داده');
        return gh(repo('/git/blobs'), { method: 'POST', body: JSON.stringify({ content: textToB64(serialize()), encoding: 'base64' }) });
      }).then(function (r) { return r.json(); }).then(function (j) {
        tree.push({ path: DATA_PATH, mode: '100644', type: 'blob', sha: j.sha });
        delFiles.forEach(function (p) { tree.push({ path: p, mode: '100644', type: 'blob', sha: null }); });
        prog('ساخت commit');
        return gh(repo('/git/trees'), { method: 'POST', body: JSON.stringify({ base_tree: rem.tree, tree: tree }) });
      }).then(function (r) { return r.json(); }).then(function (t) {
        return gh(repo('/git/commits'), { method: 'POST', body: JSON.stringify({ message: 'Admin: ' + log.length + ' catalog change(s)\n\n' + log.join('\n'), tree: t.sha, parents: [rem.sha] }) });
      }).then(function (r) { return r.json(); }).then(function (c) {
        prog('به‌روزرسانی branch');
        return gh(repo('/git/refs/heads/' + branch), { method: 'PATCH', body: JSON.stringify({ sha: c.sha }) });
      });
    }).then(function () {
      busy = false; toast('منتشر شد ✓ تا حدود یک دقیقه دیگر روی سایت دیده می‌شود.');
      return load();
    }).catch(function (e) {
      busy = false; setStatus(''); renderBar(); toast('خطا: ' + (e.message || e), true);
    });
  }

  /* ---------- translation audit ---------- */
  function trNames() { var seen = {}, out = []; data.galleries.forEach(function (g) { g.products.forEach(function (p) { if (!seen[p.name]) { seen[p.name] = 1; out.push(p.name); } }); }); return out; }
  function trIssues(nm) {
    var i = [], f = (nm.fa || '').trim(), a = (nm.ar || '').trim(), any = /[\u0600-\u06FF]/;
    if (!f) i.push('فارسی خالی'); else { if (!any.test(f)) i.push('فارسی: حروف فارسی ندارد'); if (/[كي]/.test(f)) i.push('فارسی: حرف عربی (ك/ي)'); }
    if (!a) i.push('عربی خالی'); else { if (!any.test(a)) i.push('عربی: حروف عربی ندارد'); else if (/[پچژگکی]/.test(a)) i.push('عربی: حرف فارسی (پ چ ژ گ ک ی)'); }
    if (f && a && f === a) i.push('فارسی و عربی یکسان');
    return i;
  }
  function trCount() { return trNames().filter(function (n) { return trIssues(data.names[n] || {}).length; }).length; }
  function issHtml(is) { return is.length ? is.map(function (t) { return '<span class="bad">' + esc(t) + '</span>'; }).join('') : '<span class="good">✓ سالم</span>'; }
  function renderTr(v) {
    var only = !!renderTr.only, names = trNames(), n0 = trCount();
    var html = '<div class="view-head"><h2>بررسی ترجمه‌ها (فارسی / عربی)</h2><label class="ck"><input type="checkbox" id="trOnly"' + (only ? ' checked' : '') + '> فقط موارد مشکل‌دار (' + n0 + ')</label></div>' +
      '<p class="hint">نام هر محصول یک‌بار آمده و در همه‌ی گالری‌ها اعمال می‌شود. بعد از ویرایش «انتشار تغییرات» را بزن.</p><div class="tr">';
    names.forEach(function (n) {
      var nm = data.names[n] || {}, is = trIssues(nm); if (only && !is.length) return;
      html += '<div class="tr-row" data-n="' + esc(n) + '"><div class="en">' + esc(n) + '</div><input type="text" data-l="fa" dir="rtl" placeholder="فارسی" value="' + esc(nm.fa || '') + '">' +
        '<input type="text" data-l="ar" dir="rtl" placeholder="العربية" value="' + esc(nm.ar || '') + '"><div class="iss">' + issHtml(is) + '</div></div>';
    });
    v.innerHTML = html + (only && !n0 ? '<div class="empty">همه‌ی ترجمه‌ها سالم به نظر می‌رسند ✓</div>' : '') + '</div>';
    $('trOnly').onchange = function () { renderTr.only = this.checked; renderTr(v); };
    v.querySelectorAll('.tr-row input').forEach(function (inp) {
      inp.onchange = function () {
        var row = inp.closest('.tr-row'), n = row.dataset.n, nm = Object.assign({ fa: '', ar: '' }, data.names[n]), tag = 'ترجمه «' + n + '»';
        nm[inp.dataset.l] = inp.value.trim();
        if (nm.fa || nm.ar) data.names[n] = nm; else delete data.names[n];
        log = log.filter(function (l) { return l.indexOf(tag) !== 0; }); log.push(tag + ' ویرایش شد');
        row.querySelector('.iss').innerHTML = issHtml(trIssues(nm)); renderBar(); renderNav();
      };
    });
  }

  /* ---------- history + revert ---------- */
  function openHistory() {
    if (dirty()) return toast('اول تغییرات را منتشر یا لغو کن، بعد به نسخه قبل برگرد.', true);
    var dlg = $('dlg'); $('dlgBody').innerHTML = '<h3>تاریخچه انتشارها</h3><p class="hint">در حال بارگذاری…</p>'; dlg.showModal();
    gh('/commits?path=' + DATA_PATH + '&per_page=30').then(function (r) { return r.json(); }).then(function (list) {
      var h = '<h3>تاریخچه انتشارها</h3><div class="hist">';
      list.forEach(function (c, i) {
        var lines = c.commit.message.split('\n').filter(Boolean), d = new Date(c.commit.author.date);
        h += '<div class="hrow"><div><b>' + esc(d.toLocaleString('fa-IR')) + '</b> ' + (i === 0 ? '<span class="curv">نسخه فعلی</span>' : '') +
          '<div class="hmsg">' + esc(lines.slice(1).join(' • ') || lines[0] || '') + '</div></div>' +
          (i === 0 ? '' : '<button class="btn sm" data-sha="' + esc(c.sha) + '">برگشت به این نسخه</button>') + '</div>';
      });
      $('dlgBody').innerHTML = h + '</div><div class="modal-foot"><button class="btn" id="hClose">بستن</button></div>';
      $('hClose').onclick = function () { dlg.close(); };
      $('dlgBody').querySelectorAll('[data-sha]').forEach(function (b) { b.onclick = function () { revertTo(b.dataset.sha); }; });
    }).catch(function (e) { dlg.close(); toast(e.message || String(e), true); });
  }
  function revertTo(sha) {
    if (!confirm('کاتالوگ به این نسخه برگردد؟\n(یک انتشار جدید ثبت می‌شود و نسخه فعلی هم در تاریخچه می‌ماند.)')) return;
    $('dlg').close(); busy = true; renderBar(); setStatus('در حال برگرداندن…');
    var rem;
    fetchRemote().then(function (r) { rem = r; return gh('/contents/' + DATA_PATH + '?ref=' + sha); })
      .then(function (r) { return r.text(); }).then(function (old) {
        parseData(old);
        return gh('/git/blobs', { method: 'POST', body: JSON.stringify({ content: textToB64(old), encoding: 'base64' }) });
      }).then(function (r) { return r.json(); }).then(function (b) {
        return gh('/git/trees', { method: 'POST', body: JSON.stringify({ base_tree: rem.tree, tree: [{ path: DATA_PATH, mode: '100644', type: 'blob', sha: b.sha }] }) });
      }).then(function (r) { return r.json(); }).then(function (t) {
        return gh('/git/commits', { method: 'POST', body: JSON.stringify({ message: 'Admin: revert catalog data to ' + sha.slice(0, 7), tree: t.sha, parents: [rem.sha] }) });
      }).then(function (r) { return r.json(); }).then(function (c) {
        return gh('/git/refs/heads/' + branch, { method: 'PATCH', body: JSON.stringify({ sha: c.sha }) });
      }).then(function () { busy = false; toast('برگشت انجام شد ✓ تا حدود یک دقیقه دیگر روی سایت دیده می‌شود.'); return load(); })
      .catch(function (e) { busy = false; setStatus(''); renderBar(); toast('خطا: ' + (e.message || e), true); });
  }

  /* ---------- live preview (unpublished data + new images) ---------- */
  function previewShim(M) {   // runs INSIDE the preview iframe, before the site's own scripts
    function fix(v) { if (typeof v !== 'string') return v; var k = v.split('?')[0].replace(/^\//, ''); try { k = decodeURI(k); } catch (e) {} return M[k] || v; }
    var d = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src'), sa = Element.prototype.setAttribute;
    Object.defineProperty(HTMLImageElement.prototype, 'src', { get: d.get, set: function (v) { d.set.call(this, fix(v)); } });
    Element.prototype.setAttribute = function (n, v) { if (n === 'src' && this.tagName === 'IMG') v = fix(v); return sa.call(this, n, v); };
    ['pushState', 'replaceState'].forEach(function (k) { var o = history[k]; history[k] = function () { try { return o.apply(history, arguments); } catch (e) {} }; });
    new MutationObserver(function (ms) { ms.forEach(function (m) { m.addedNodes.forEach(function (n) {
      if (n.nodeType !== 1) return;
      (n.tagName === 'IMG' ? [n] : [].slice.call(n.querySelectorAll('img'))).forEach(function (i) { var s = i.getAttribute('src'), f = fix(s); if (f !== s) i.setAttribute('src', f); });
    }); }); }).observe(document, { childList: true, subtree: true });
  }
  function openPreview() {
    var map = {}; newFiles.forEach(function (v, p) { map[p] = v.url; }); toast('در حال ساخت پیش‌نمایش…');
    fetch('/', { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (html) {
      var tag = '<script>' + serialize().replace(/</g, '\\u003c') + '<\/script>';
      var re = /<script[^>]*src=["']\/data\/catalog-data\.js["'][^>]*><\/script>/i;
      if (!re.test(html)) throw new Error('در صفحه‌ی اصلی سایت، فراخوانی data/catalog-data.js پیدا نشد.');
      html = html.replace(re, function () { return tag; })
        .replace(/<head[^>]*>/i, function (m) { return m + '<base href="/"><script>(' + previewShim.toString() + ')(' + JSON.stringify(map) + ')<\/script>'; });
      $('pvFrame').srcdoc = html; $('pv').classList.remove('m'); $('pv').showModal();
    }).catch(function (e) { toast(e.message || String(e), true); });
  }
  $('previewBtn').onclick = openPreview; $('histBtn').onclick = openHistory;
  $('pvM').onclick = function () { $('pv').classList.toggle('m'); };
  $('pvClose').onclick = function () { $('pv').close(); $('pvFrame').srcdoc = ''; };
  $('pv').addEventListener('cancel', function () { $('pvFrame').srcdoc = ''; });

  /* ---------- boot ---------- */
  function showLogin(msg) { $('app').hidden = true; $('login').hidden = false; $('loginErr').textContent = msg || ''; }
  function start() {
    $('login').hidden = true; $('app').hidden = false;
    load().catch(function (e) {
      setStatus('');

      else toast(e.message || String(e), true);
    });
  }
  $('loginBtn').onclick = function () {
    var u = $('userInput').value.trim(), pw = $('passInput').value; if (!u || !pw) return;
    var bytes = new TextEncoder().encode(u + ':' + pw), bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    auth = btoa(bin); try { localStorage.setItem('jc_auth', auth); } catch (e) {}
    $('passInput').value = ''; start();
  };
  $('passInput').onkeydown = function (e) { if (e.key === 'Enter') $('loginBtn').click(); };
  $('logoutBtn').onclick = function () {
    if (dirty() && !confirm('تغییرات منتشرنشده از بین می‌رود. خارج می‌شوی؟')) return;
    localStorage.removeItem('jc_auth'); auth = ''; showLogin('');
  };
  $('publishBtn').onclick = publish;
  $('discardBtn').onclick = function () { if (confirm('همه‌ی تغییرات منتشرنشده لغو شود؟')) load().catch(function (e) { toast(e.message, true); }); };
  window.addEventListener('beforeunload', function (e) { if (dirty()) { e.preventDefault(); e.returnValue = ''; } });

  try { localStorage.removeItem('jc_token'); auth = localStorage.getItem('jc_auth') || ''; } catch (e) { auth = ''; }
  if (auth) start(); else showLogin('');
})();
</script>
</body>
</html>
