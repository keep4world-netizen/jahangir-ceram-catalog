<head>

<title>Jahangir Ceram</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');

  :root {
    --dark: #343434;
    --gold: #D5982C;
    --silver: #C0C0C0;
    --dark-2: #3d3d3d;
    --dark-3: #2a2a2a;
    --surface: #cfcfcf;
    --border: #4a4a4a;
    --muted: #999;
  }
  body.light-mode {
    --dark: #f7f7f7;
    --dark-2: #ffffff;
    --dark-3: #eeeeee;
    --silver: #333333;
    --surface: #d8d8d8;
    --border: #c8c8c8;
    --muted: #666666;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Vazirmatn', sans-serif;
    background: var(--surface);
    transition: background 0.2s ease, color 0.2s ease;
  }
  button { font-family: inherit; cursor: pointer; }
  .theme-toggle {
    align-self: flex-start;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    color: var(--silver);
    background: var(--dark-2);
    border: 1px solid var(--border);
    border-radius: 50%;
    padding: 0;
    font-size: 13px;
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .theme-toggle:hover { color: var(--gold); border-color: var(--gold); }
  .theme-icon {
    display: inline-block;
    font-size: 19px;
    line-height: 1;
    vertical-align: middle;
  }
  .page-number {
    margin-top: auto;
    padding-top: 12mm;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
  }
  .back-icon {
    display: inline-block;
    margin-left: 6px;
    font-size: 18px;
    line-height: 1;
    vertical-align: -1px;
  }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .page {
    width: 210mm;
    min-height: 297mm;
    margin: 0 auto 12mm;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20mm;
    background: var(--dark);
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
  }
  .logo {
    width: min(140px, 32vw);
    height: auto;
  }
  .title {
    color: var(--silver);
    font-size: clamp(24px, 5vw, 36px);
    font-weight: 900;
    text-align: center;
    margin: 18px 0 40px;
    letter-spacing: 0.3px;
    direction: ltr;
  }

  .categories {
    width: 100%;
    max-width: 560px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  .cat-btn {
    position: relative;
    overflow: hidden;
    background: linear-gradient(145deg, var(--dark-2), var(--dark-3));
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 30px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
    transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  }
  .cat-btn:hover {
    transform: translateY(-3px);
    border-color: var(--gold);
    background: linear-gradient(145deg, var(--dark-3), var(--dark-2));
    box-shadow: 0 14px 28px rgba(0, 0, 0, 0.28);
  }
  .cat-btn img.cat-icon {
    height: clamp(56px, 12vw, 76px);
    width: auto;
    max-width: 100%;
    object-fit: contain;
    filter: invert(70%) sepia(55%) saturate(950%) hue-rotate(1deg) brightness(0.95) contrast(0.98);
  }
  .cat-btn .cat-icon-placeholder {
    width: 64px;
    height: 64px;
    border: 1.5px dashed #6a6a6a;
    border-radius: 4px;
  }
  .cat-btn span {
    color: var(--silver);
    font-size: 15px;
    font-weight: 600;
  }
  .cat-btn.active {
    border-color: var(--gold);
    background: var(--dark-3);
  }
  .cat-btn.active span { color: var(--gold); }
  .cat-btn.active img.cat-icon { filter: invert(70%) sepia(55%) saturate(950%) hue-rotate(1deg) brightness(1.1) contrast(1.02); }

  .subpanel {
    grid-column: 1 / -1;
    display: none;
    background: var(--dark-3);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 16px;
    margin-top: -2px;
  }
  .subpanel.open { display: flex; flex-direction: column; gap: 8px; }
  .category-sheet .catalog-page {
    background: linear-gradient(145deg, var(--dark-3), var(--dark-2));
    border-radius: 14px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 12px 30px rgba(0,0,0,0.14);
  }
  .category-subitems {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 8px auto 0;
  }
  .category-subitems > .sub-item {
    font-size: 15px;
    border-radius: 9px;
    padding: 14px 16px;
    background: linear-gradient(90deg, var(--dark-2), var(--dark-3));
  }
  .subpanel .sub-item {
    color: var(--silver);
    font-size: 14px;
    padding: 10px 12px;
    background: var(--dark-2);
    border: 1px solid var(--border);
    border-radius: 3px;
    text-align: right;
  }
  .sub-item-clickable {
    width: 100%;
    font-family: inherit;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .sub-item-clickable.active {
    border-color: var(--gold);
    background: var(--dark-3);
    color: var(--gold);
  }
  .child-panel {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px 12px 4px 12px;
    margin-top: -2px;
  }
  .child-title {
    color: var(--gold);
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .child-panel .sub-item {
    background: var(--dark-3);
    font-size: 13px;
  }
  .catalog-page {
    width: 100%;
    max-width: 100%;
    background: var(--dark-3);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 20px;
  }
  .catalog-back {
    color: var(--silver);
    background: var(--dark-2);
    border: 1px solid #5a5a5a;
    border-radius: 3px;
    padding: 10px 14px;
    margin-bottom: 20px;
    font-size: 14px;
  }
  .catalog-back:hover { border-color: var(--gold); color: var(--gold); }
  .catalog-breadcrumb {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    margin: 0 0 18px;
  }
  .catalog-heading {
    color: var(--gold);
    font-size: 22px;
    font-weight: 800;
    text-align: center;
    margin: 0 0 8px;
  }
  .catalog-subheading {
    color: var(--silver);
    font-size: 13px;
    text-align: center;
    margin: 0 0 20px;
  }
  .catalog-sheet { justify-content: flex-start; }
  @media (max-width: 820px) {
    .page {
      width: calc(100vw - 20px);
      min-height: calc((100vw - 20px) * 1.4142);
      margin-bottom: 10px;
      padding: 28px 18px 40px;
    }
  }
  @media print {
    html, body { background: #fff; }
    .page { margin: 0; box-shadow: none; page-break-after: always; }
  }

  .category-subitems { counter-reset: category-card; }

<body>
<div class="page">

<img alt="Jahangir Ceram logo" class="logo" src="/assets/images/jahangir-ceram-logo.webp"/>
<p class="title">Jahangir Ceram Catalogs</p>
<div class="categories" id="categories"></div>
<div class="page-number">Page 1</div>
</div>
<div id="catalog-pages"></div>
<script>

  /* Two main categories — the Sialk Ceram logo has not been uploaded yet and will be added when available */
  var CATEGORIES = [
    { id: "jahangir", name: "Jahangir Ceram", logo: "/assets/images/sialk-ceram-logo.webp", sub: [
      { name: "Porcelain Ceramic", children: { title: "Matte Glaze", items: ["80×80", "60×120"] } },
      "Ceramic Washbasin",
      "Ceramic Puzzle",
      { name: "Decorative", children: { title: "Coating and Laser Products", items: ["Fitileh", "Takgol"] } }
    ] },
    { id: "sialk", name: "Sialk Ceram", logo: "/assets/images/catalog-brand.webp", sub: [
      { name: "Porcelain Ceramic", children: { title: "", items: [
        { name: "Nano Polish", children: { title: "", items: ["60×120", "80×80", "100×100"] } },
        { name: "Crystal Polish", children: { title: "", items: ["100×100"] } }
      ] } }
    ] }
  ];

    var activeId = null;
  var MATTE_GLAZE_PRODUCTS = [
    "Cloudy",
    "Mitis",

    "Matic Light",
    "Matic Dark",
    "Matsu Gray",
    "Matsu Cream"

  var MATTE_GLAZE_IMAGES = ["/assets/images/cloudy-gallery-80x80.webp","/assets/images/mitis-gallery-80x80.webp","/assets/images/neomatte-gallery-80x80.webp","/assets/images/externalized-image-1.webp","/assets/images/matic-dark-gallery-80x80.webp","/assets/images/matsu-gray-gallery-80x80.webp","/assets/images/matsu-cream-gallery-80x80.webp"];
  var CLOUDY_PRODUCT_IMAGE = '/assets/images/externalized-image-2.webp';
  // Matic Light had a NO IMAGE AVAILABLE placeholder; use a valid light product photo fallback.
  MATTE_GLAZE_IMAGES[3] = MATTE_GLAZE_IMAGES[1];

  function renderProductGallery(backKey) {
    return '<div class="product-grid" aria-label="Seven Matte Glaze Products">' +
      MATTE_GLAZE_PRODUCTS.map(function (name, index) {
        var productHash = '#product-80x80-' + index;
        return '<a class="product-card product-link" href="' + productHash + '" data-product-index="' + index + '" aria-label="View ' + name + ' 80×80 product page">' +
          '<div class="product-photo has-image" role="img" aria-label="' + name + '">' +
            '<img src="' + MATTE_GLAZE_IMAGES[index] + '" alt="' + name + ' 80×80" loading="lazy" decoding="async">' +
          '</div>' +
          '<div class="product-name">' + name + '</div>' +
        '</a>';
      }).join("") +
    '</div>';
  }
  var activeSubName = null;
  var themeToggle = document.getElementById("theme-toggle");

  function updateThemeButton() {
    var isLight = document.body.classList.contains("light-mode");
    themeToggle.innerHTML = isLight
      ? '<span class="theme-icon" aria-hidden="true">☾</span>'
      : '<span class="theme-icon" aria-hidden="true">☀</span>';
    themeToggle.setAttribute("aria-pressed", String(isLight));
  }

  themeToggle.onclick = function () {
    document.body.classList.toggle("light-mode");
    updateThemeButton();
  };
  updateThemeButton();
  var pageTitle = document.querySelector(".title");
  var defaultTitle = pageTitle.textContent;

  function ensureProductPage(index, backKey) {
    var pages = document.getElementById("catalog-pages");
    var name = MATTE_GLAZE_PRODUCTS[index];
    var pageKey = "product-80x80-" + index;
    var existingSheet = Array.prototype.find.call(
      pages.querySelectorAll(".catalog-sheet"),
      function (candidate) { return candidate.dataset.pageKey === pageKey; }
    );
    if (existingSheet) return existingSheet;

    var sheet = document.createElement("div");
    sheet.className = "page catalog-sheet product-detail-sheet";
    sheet.dataset.pageKey = pageKey;
    sheet.dataset.pageNumber = String(pages.querySelectorAll(".page").length + 2);
    var page = document.createElement("section");
    page.className = "catalog-page product-detail-page" + (index === 0 ? " cloudy-product-page" : "");
    var cloudyImageMarkup = index === 0
      ? '<img class="cloudy-product-image" src="' + CLOUDY_PRODUCT_IMAGE + '" alt="Cloudy 80×80 product presentation" loading="eager" decoding="async">'
      : '';
    page.innerHTML =
      '<button class="catalog-back" type="button"><span class="back-icon" aria-hidden="true">↩</span>Back</button>' +
      '<h2 class="catalog-heading">' + name + ' · 80×80</h2>' +
      '<p class="catalog-breadcrumb">Jahangir Ceram / Porcelain Ceramic / Matte Glaze / 80×80</p>' +
      cloudyImageMarkup +
      (index === 0 ? '' : '<div class="coming-soon-message" data-placeholder="coming-soon">Coming Soon<small>به‌زودی</small></div>') +
      '<div class="page-number">Page ' + sheet.dataset.pageNumber + '</div>';
    page.querySelector(".catalog-back").onclick = function () {
      var target = backKey
        ? Array.prototype.find.call(pages.querySelectorAll(".page"), function (candidate) { return candidate.dataset.pageKey === backKey; })
        : null;
      if (target) {
        history.pushState({ pageKey: backKey }, "", "#catalog-80x80");
        target.scrollIntoView({ behavior: "smooth", block: "start" });
      } else {
        history.pushState({}, "", location.pathname + location.search);
        document.querySelector(".page").scrollIntoView({ behavior: "smooth", block: "start" });
      }
    };
    sheet.appendChild(page);
    pages.appendChild(sheet);
    return sheet;
  }
  function showProductPage(index, backKey) {
    var sheet = ensureProductPage(index, backKey);
    history.pushState({ pageKey: sheet.dataset.pageKey }, "", "#product-80x80-" + index);
    sheet.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  function precreateProductPages(backKey) {
    MATTE_GLAZE_PRODUCTS.forEach(function (_name, index) {
      ensureProductPage(index, backKey);
    });
  }

  function showCatalogPage(size, options) {
    options = options || {};
    var pages = document.getElementById("catalog-pages");
    var pageKey = options.key || size;
    var backTargetKey = options.backKey || null;
    var existingSheet = Array.prototype.find.call(
      pages.querySelectorAll(".catalog-sheet"),
      function (candidate) { return candidate.dataset.pageKey === pageKey; }
    );
    if (existingSheet) {
      if (!options.initial) history.pushState({ pageKey: pageKey }, "", "#catalog-" + encodeURIComponent(pageKey));
      existingSheet.scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }
    var sheet = document.createElement("div");
    sheet.className = "page catalog-sheet";
    sheet.dataset.pageKey = pageKey;
    sheet.dataset.pageNumber = String(pages.querySelectorAll(".page").length + 2);
    var page = document.createElement("section");
    page.className = "catalog-page";
    page.innerHTML =
      '<button class="catalog-back" type="button"><span class="back-icon" aria-hidden="true">↩</span>Back</button>' +
      '<h2 class="catalog-heading">Catalogs ' + size + '</h2>' +
      '<p class="catalog-breadcrumb">' + (options.path || "") + '</p>' +
      (options.productGallery ? renderProductGallery(pageKey) : '<div class="coming-soon-message" data-placeholder="coming-soon">Coming Soon<small>به‌زودی</small></div>') +
      '<div class="page-number">Page ' + sheet.dataset.pageNumber + '</div>';
    page.querySelectorAll(".product-link").forEach(function (link) {
      link.addEventListener("click", function (event) {
        event.preventDefault();
        showProductPage(Number(link.dataset.productIndex), backTargetKey || pageKey);
      });
    });
    page.querySelector(".catalog-back").onclick = function () {
      var target = backTargetKey
        ? Array.prototype.find.call(pages.querySelectorAll(".page"), function (candidate) {
            return candidate.dataset.pageKey === backTargetKey;
          })
        : null;
      if (target) {
        history.pushState({ pageKey: backTargetKey }, "", "#category-" + backTargetKey.replace("category-", ""));
        target.scrollIntoView({ behavior: "smooth", block: "start" });
      } else {
        history.pushState({}, "", location.pathname + location.search);
        document.querySelector(".page").scrollIntoView({ behavior: "smooth", block: "start" });
      }
    };
    sheet.appendChild(page);
    pages.appendChild(sheet);
    if (!options.initial) {
      history.pushState({ catalogSize: size }, "", "#catalog-" + encodeURIComponent(size));
      sheet.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  }

  function isBranch(entry) {
    return entry && typeof entry === "object" && entry.children;
  }
  function entryLabel(entry) {
    return isBranch(entry) ? entry.name : String(entry);
  }
  function pathKey(parts) {
    return parts.map(function (part) {
      return String(part).replace(/\s+/g, "-");
    }).join("-");
  }
  function makeChildId(category, parts) {
    return category.id + "-" + pathKey(parts) + "-children";
  }
  function renderEntryList(entries, list, category, parentPath) {
    (entries || []).forEach(function (entry) {
      var branch = isBranch(entry);
      var name = entryLabel(entry);
      var currentPath = parentPath.concat([name]);
      var item = document.createElement("button");
      item.type = "button";
      item.className = "sub-item sub-item-clickable";
      item.textContent = name;
      list.appendChild(item);

      if (branch) {
        item.classList.add("has-children");
        item.setAttribute("aria-expanded", "false");
        var childPanel = document.createElement("div");
        childPanel.className = "child-panel";
        childPanel.hidden = true;
        var childId = makeChildId(category, currentPath);
        item.setAttribute("aria-controls", childId);
        childPanel.id = childId;
        item.onclick = function () {
          var isOpen = !childPanel.hidden;
          childPanel.hidden = isOpen;
          item.setAttribute("aria-expanded", String(!isOpen));
        };
        if (entry.children.title) {
          var childTitle = document.createElement("div");
          childTitle.className = "child-title";
          childTitle.textContent = entry.children.title;
          childPanel.appendChild(childTitle);
        }
        var childPath = entry.children.title ? currentPath.concat([entry.children.title]) : currentPath;
        renderEntryList(entry.children.items, childPanel, category, childPath);
        list.appendChild(childPanel);
      } else {
        item.onclick = function () {
          var fullPath = [category.name].concat(currentPath);
          showCatalogPage(name, {
            key: category.id + "-" + pathKey(currentPath),
            path: fullPath.join(" / "),
            productGallery: category.id === "jahangir" && currentPath.indexOf("Matte Glaze") !== -1 && name === "80×80",
            backKey: "category-" + category.id
          });
        };
      }
    });
  }
  function showCategoryPage(category, options) {
    options = options || {};
    var pages = document.getElementById("catalog-pages");
    var pageKey = "category-" + category.id;
    var existingSheet = Array.prototype.find.call(
      pages.querySelectorAll(".category-sheet"),
      function (candidate) { return candidate.dataset.pageKey === pageKey; }
    );
    if (existingSheet) {
      if (!options.initial) history.pushState({ pageKey: pageKey }, "", "#category-" + category.id);
      existingSheet.scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }
    var sheet = document.createElement("div");
    sheet.className = "page category-sheet";
    sheet.dataset.pageKey = pageKey;
    sheet.dataset.pageNumber = String(pages.querySelectorAll(".page").length + 2);
    var page = document.createElement("section");
    page.className = "catalog-page";
    page.innerHTML =
      '<button class="catalog-back" type="button"><span class="back-icon" aria-hidden="true">↩</span>Back</button>' +
      '<h2 class="catalog-heading">' + category.name + '</h2>' +
      '<p class="catalog-breadcrumb">Select a subcategory of ' + category.name + '</p>' +
      '<div class="category-subitems"></div>' +
      '<div class="page-number">Page ' + sheet.dataset.pageNumber + '</div>';
    renderEntryList(category.sub, page.querySelector(".category-subitems"), category, []);
    page.querySelector(".catalog-back").onclick = function () {
      history.pushState({}, "", location.pathname + location.search);
      document.querySelector(".page").scrollIntoView({ behavior: "smooth", block: "start" });
    };
    sheet.appendChild(page);
    pages.appendChild(sheet);
    if (!options.initial) {
      history.pushState({ pageKey: pageKey }, "", "#category-" + category.id);
      sheet.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  }
  function precreateCatalogPages(category, entries, parentPath) {
    (entries || []).forEach(function (entry) {
      if (isBranch(entry)) {
        var branchPath = parentPath.concat([entry.name]);
        if (entry.children.title) branchPath.push(entry.children.title);
        precreateCatalogPages(category, entry.children.items, branchPath);
      } else {
        var name = String(entry);
        var currentPath = parentPath.concat([name]);
        var pageOptions = {
          key: category.id + "-" + pathKey(currentPath),
          path: [category.name].concat(currentPath).join(" / "),
          productGallery: category.id === "jahangir" && currentPath.indexOf("Matte Glaze") !== -1 && name === "80×80",
          backKey: "category-" + category.id,
          initial: true
        };
        showCatalogPage(name, pageOptions);
        if (pageOptions.productGallery) {
          precreateProductPages(pageOptions.key);
        }
      }
    });
  }

  function createAboutPage() {
    var pages = document.getElementById("catalog-pages");
    var pageKey = "about-us";
    var existing = Array.prototype.find.call(
      pages.querySelectorAll(".catalog-sheet"),

      '<button class="catalog-back" type="button"><span class="back-icon" aria-hidden="true">↩</span>Back</button>' +
      '<h2 class="catalog-heading">About Us</h2>' +
      '<p class="catalog-breadcrumb">Jahangir Ceram / About Us</p>' +
      '<div class="about-panel">' +
        '<svg class="about-panel-icon" viewBox="0 0 24 24" aria-hidden="true">' +
          '<circle cx="12" cy="12" r="9"></circle>' +
          '<path d="M12 11v5"></path>' +
          '<path d="M12 8h.01"></path>' +
        '</svg>' +
        '<div>Explore the Jahangir Ceram and Sialk Ceram collections, including their ceramic and porcelain finishes.</div>' +
      '</div>' +
      '<div class="page-number">Page ' + sheet.dataset.pageNumber + '</div>';
    page.querySelector(".catalog-back").onclick = function () {
      history.pushState({}, "", location.pathname + location.search);
      document.querySelector(".page").scrollIntoView({ behavior: "smooth", block: "start" });
    };
    sheet.appendChild(page);
    pages.appendChild(sheet);
    return sheet;
  }
  function createContactPage() {

    var page = document.createElement("section");
    page.className = "catalog-page contact-page";
    page.innerHTML =
      '<button class="catalog-back" type="button"><span class="back-icon" aria-hidden="true">↩</span>Back</button>' +
      '<h2 class="catalog-heading">Contact Us</h2>' +
      '<p class="catalog-breadcrumb">Jahangir Ceram / Contact Us</p>' +
      '<div class="contact-panel">' +
        '<svg class="contact-panel-icon" viewBox="0 0 24 24" aria-hidden="true">' +
          '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.63a2 2 0 0 1-.45 2.11L8 9.73a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.85.29 1.73.5 2.63.62A2 2 0 0 1 22 16.92z"></path>' +
        '</svg>' +
        '<div>For product inquiries and further information, please contact Jahangir Ceram.</div>' +
        '<div class="social-links" aria-label="Social media and website links">' +
          '<a class="social-link" href="#" data-platform="instagram" aria-label="Instagram" title="Instagram">' +
            '<svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r=".8" fill="currentColor" stroke="none"></circle></svg><span class="social-label">Instagram</span>' +
          '</a>' +
          '<a class="social-link" href="#" data-platform="whatsapp" aria-label="WhatsApp" title="WhatsApp">' +
            '<svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.5-4.1A8 8 0 1 1 20 11.5z"></path><path d="M8.7 8.4c.2-.4.4-.4.7-.4h.5c.2 0 .4.1.5.4l.7 1.6c.1.2.1.4-.1.6l-.6.7c.6 1.1 1.5 2 2.6 2.6l.7-.6c.2-.2.4-.2.6-.1l1.6.7c.3.1.4.3.4.5v.5c0 .3 0 .5-.4.7-.4.2-1 .3-1.5.1-2.7-.7-5.1-3-5.9-5.7-.2-.6-.1-1.1.2-1.6z"></path></svg><span class="social-label">WhatsApp</span>' +
          '</a>' +
          '<a class="social-link" href="#" data-platform="telegram" aria-label="Telegram" title="Telegram">' +
            '<svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m21 3-3.2 18-6.2-5.4-3.5 3.4.5-5.1L21 3z"></path><path d="m8.6 13.9 8.8-7.1-7.6 8.1"></path></svg><span class="social-label">Telegram</span>' +
          '</a>' +
          '<a class="social-link" href="#" data-platform="linkedin" aria-label="LinkedIn" title="LinkedIn">' +
            '<svg class="social-icon text-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" fill="currentColor"></rect><text x="6.5" y="17" font-size="10" font-family="Arial, sans-serif" font-weight="700" fill="#2A2A2A">in</text></svg><span class="social-label">LinkedIn</span>' +
          '</a>' +
          '<a class="social-link" href="#" data-platform="bale" aria-label="Bale" title="Bale">' +
            '<svg class="social-icon text-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="currentColor"></circle><text x="8.2" y="16.2" font-size="11" font-family="Arial, sans-serif" font-weight="700" fill="#2A2A2A">B</text></svg><span class="social-label">Bale</span>' +
          '</a>' +
          '<a class="social-link" href="#" data-platform="eitaa" aria-label="Eitaa" title="Eitaa">' +
            '<svg class="social-icon text-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="currentColor"></circle><text x="8.2" y="16.2" font-size="11" font-family="Arial, sans-serif" font-weight="700" fill="#2A2A2A">E</text></svg><span class="social-label">Eitaa</span>' +
          '</a>' +
          '<a class="social-link" href="#" data-platform="rubika" aria-label="Rubika" title="Rubika">' +
            '<svg class="social-icon text-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="currentColor"></circle><text x="8.1" y="16.2" font-size="11" font-family="Arial, sans-serif" font-weight="700" fill="#2A2A2A">R</text></svg><span class="social-label">Rubika</span>' +
          '</a>' +
          '<a class="social-link" href="#" data-platform="aparat" aria-label="Aparat" title="Aparat">' +
            '<svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="3"></rect><path d="m10 9 5 3-5 3z" fill="currentColor" stroke="none"></path></svg><span class="social-label">Aparat</span>' +
          '</a>' +
          '<a class="social-link" href="#" data-platform="website" aria-label="Website" title="Website">' +
            '<svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg><span class="social-label">Website</span>' +
          '</a>' +
        '</div>' +
      '</div>' +
      '<div class="page-number">Page ' + sheet.dataset.pageNumber + '</div>';
    page.querySelector(".catalog-back").onclick = function () {
      history.pushState({}, "", location.pathname + location.search);
      document.querySelector(".page").scrollIntoView({ behavior: "smooth", block: "start" });
    };
    sheet.appendChild(page);
    pages.appendChild(sheet);
    return sheet;
  }
  function render() {
    var wrap = document.getElementById("categories");
    wrap.innerHTML = "";
    CATEGORIES.forEach(function (cat) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "cat-btn" + (activeId === cat.id ? " active" : "");
      btn.setAttribute("aria-pressed", String(activeId === cat.id));
      var iconHtml = cat.logo
        ? '<img class="cat-icon" src="' + cat.logo + '" alt="' + cat.name + '">'
        : '<div class="cat-icon-placeholder"></div>';
      btn.innerHTML = iconHtml + "<span>" + cat.name + "</span>";
      btn.onclick = function () {
        activeId = cat.id;
        render();
        showCategoryPage(cat);
      };
      wrap.appendChild(btn);
    });
    var contactButton = document.createElement("button");
    contactButton.type = "button";
    contactButton.className = "cat-btn contact-btn";
    contactButton.setAttribute("aria-label", "Contact Us");
    contactButton.setAttribute("aria-pressed", "false");
    contactButton.innerHTML =
      '<svg class="contact-icon" viewBox="0 0 24 24" aria-hidden="true">' +
        '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.63a2 2 0 0 1-.45 2.11L8 9.73a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.85.29 1.73.5 2.63.62A2 2 0 0 1 22 16.92z"></path>' +
      '</svg><span>Contact Us</span>';
    contactButton.onclick = function () {
      var contactPage = document.querySelector('.contact-sheet');
      if (contactPage) {
        history.pushState({ pageKey: "contact-us" }, "", "#contact-us");
        contactPage.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    };
    wrap.appendChild(contactButton);
    var aboutButton = document.createElement("button");
    aboutButton.type = "button";
    aboutButton.className = "cat-btn about-btn";
    aboutButton.setAttribute("aria-label", "About Us");
    aboutButton.setAttribute("aria-pressed", "false");
    aboutButton.innerHTML =
      '<svg class="about-icon" viewBox="0 0 24 24" aria-hidden="true">' +
        '<circle cx="12" cy="12" r="9"></circle>' +
        '<path d="M12 11v5"></path>' +
        '<path d="M12 8h.01"></path>' +
      '</svg><span>About Us</span>';
    aboutButton.onclick = function () {
      var aboutPage = document.querySelector('.about-sheet');
      if (aboutPage) {
        history.pushState({ pageKey: "about-us" }, "", "#about-us");
        aboutPage.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    };
    wrap.appendChild(aboutButton);
  }

  window.addEventListener("popstate", function () {
    if (!location.hash.startsWith("#catalog-") && !location.hash.startsWith("#category-")) {
      pageTitle.textContent = defaultTitle;
      activeId = null;
      activeSubName = null;
      render();
    }
  });

  createAboutPage();
  CATEGORIES.forEach(function (category) {
    showCategoryPage(category, { initial: true });
    precreateCatalogPages(category, category.sub, []);
  });
  createContactPage();
  render();
</script>
</body>
</html>
